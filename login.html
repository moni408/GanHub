<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background:black;
    }
    .container {
      width: 350px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #c20808;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #ea1717;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #f83333;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: rgb(255, 21, 0);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="form-title">Signup</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button onclick="handleSubmit()">Signup</button>
    <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
  </div>

  <script>
    let isSignup = true;

    function toggleForm() {
      isSignup = !isSignup;
      document.getElementById("form-title").innerText = isSignup ? "Signup" : "Login";
      document.querySelector("button").innerText = isSignup ? "Signup" : "Login";
      document.querySelector(".toggle").innerText = isSignup ? "Already have an account? Login" : "Don't have an account? Signup";
    }
    function handleSubmit() {
      let username = document.getElementById("username").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      if (isSignup) {
        // Store user in localStorage
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let exists = users.find(u => u.email === email);
        if (exists) {
          alert("Email already registered!");
          return;
        }
        users.push({ username, email, password });
        localStorage.setItem("users", JSON.stringify(users));
        alert("Signup successful! You can now login.");
        toggleForm();
      } else {
        // Login
        let users = JSON.parse(localStorage.getItem("users")) || [];
        let user = users.find(u => u.email === email && u.password === password);
        if (user) {
          alert(`Welcome back, ${user.username}!`);
          localStorage.setItem("currentUser", user.username);
          window.location.href = "index.html";
        } else {
          alert("Invalid email or password!");
        }
      }
    }
  </script>
</body>
</html>
