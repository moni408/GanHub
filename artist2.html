<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habib Wahid</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #000000, #1a1a1a);
    color: #fff;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 900px;
    background: #111;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    padding: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .artist-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2rem;
  }

  .artist-pic img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #ff0000;
    box-shadow: 0 0 20px #ff0000;
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .artist-pic img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px #ff4d4d;
  }

  .artist-songs h2 {
    font-size: 2rem;
    color: #ff0000;
    margin-bottom: 1.5rem;
    text-align: center;
    letter-spacing: 1px;
  }

  .artist-songs ul {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.8rem;
  }

  .artist-songs ul li {
    background: #222;
    padding: 0.6rem 1.2rem;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  .artist-songs ul li:hover {
    background: #ff0000;
    color: #fff;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255,0,0,0.5);
  }

  @media (min-width: 768px) {
    .artist-section {
      flex-direction: row;
      align-items: flex-start;
    }

    .artist-songs {
      flex: 1;
      text-align: left;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="artist-section">
    <div class="artist-pic">
      <img src="Habib_Wahid_in_2022.jpg" alt="Shayan Chowdhury Arnob">
    </div>
    <div class="artist-songs">
      <h2>Habib Wahid</h2>
      <ul id="song-list"></ul>
    </div>
  </div>
</div>

<script>
  const arnobSongs = [
    "Shayan Chowdhury Arnob (Arnob)",
    "Se Je Boshe Ache",
    "Holud Boron",
    "Tomar Janalar Kachhe",
    "Chander Gaan"
  ];

  const songList = document.getElementById("song-list");

  arnobSongs.forEach(song => {
    const li = document.createElement("li");
    li.textContent = song;
    songList.appendChild(li);
  });
</script>

</body>
</html>
